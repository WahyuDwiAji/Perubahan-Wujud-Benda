<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Laboratorium Ajaib</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: halaman utama = gambar penuh dengan area sentuh di atas tiap kartu; halaman dalam = kartu putih bergaya gelembung di atas latar biru muda, navigasi bawah biru tua. */
:root{
  --ink:#0a2a66; --muted:#46618f; --blue:#1666e0; --deep:#0b4fbf; --sky:#e3f1ff; --sky2:#c4e2ff;
  --sun:#ffc21a; --orange:#ff8a1f; --good:#1f9d55; --bad:#e0483e; --card:#ffffff; --line:#b9d8fb;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font:600 16px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* HOME */
.home{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:8px 24px}
.stage{position:relative;width:min(100%,calc(100dvh*1.7768));aspect-ratio:1672/941;border-radius:clamp(10px,1.6vw,22px);overflow:hidden;box-shadow:0 10px 30px rgba(11,79,191,.25);background:#cfe9ff}
.stage>img{display:block;width:100%;height:100%;object-fit:cover}
.hot{position:absolute;background:transparent;border:0;border-radius:clamp(10px,2vw,26px);padding:0;transition:transform .15s,box-shadow .15s}
.hot:hover,.hot:focus-visible{transform:scale(1.04);box-shadow:0 0 0 3px #fff,0 0 22px 4px rgba(255,194,26,.9)}
.hot:active{transform:scale(.98)}
.hot .ck{position:absolute;right:4%;top:4%;min-width:22%;aspect-ratio:1;border-radius:50%;background:var(--good);color:#fff;font:700 clamp(8px,1.5vw,18px)/1 var(--display);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);padding:2px}
.mm{display:none;width:100%}
.mm h2{font-size:20px;margin-bottom:10px}
.mm .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mm button,.chap{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;min-width:0}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font:600 17px/1 var(--display);display:grid;place-items:center}
.num.ok{background:var(--good)}
@media (max-width:720px){.mm{display:block}}

/* INNER */
.page{max-width:900px;margin:0 auto;padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#0f5bd0,#0b4fbf);color:#fff;box-shadow:0 4px 14px rgba(11,79,191,.3)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0f5bd0}
.top h1{font-size:clamp(18px,4.5vw,26px);flex:1;min-width:0}
.back{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;white-space:nowrap}
.stars{background:#fff;color:var(--deep);border-radius:999px;padding:4px 12px;font:600 15px var(--display);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:0 4px 0 var(--sky2);min-width:0}
.card h2{font-size:22px;margin-bottom:8px;color:var(--deep)}
.card h3{font-size:18px;margin:12px 0 4px}
.card p+p{margin-top:8px}
.card ul{margin:8px 0 0;padding-left:22px}
.card li{margin:4px 0}
.say{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff,#eaf5ff);border:2px solid var(--line);border-radius:22px;padding:14px 16px}
.say img{width:76px;height:76px;border-radius:50%;border:3px solid var(--blue);flex:none}
.say p{font-weight:700}
.fact{background:#fff8dc;border:2px solid #ffe08a;border-radius:18px;padding:14px 16px}
.fact b{font-family:var(--display);color:#b86500;font-size:18px;display:block}
.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{border:2px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--sky);font-family:var(--display);font-weight:600}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 24px;font:600 18px var(--display);color:#fff;background:linear-gradient(#2f8bff,#1666e0);box-shadow:0 4px 0 #0b4fbf}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0b4fbf}
.btn.sun{background:linear-gradient(#ffd04a,#ff9a1f);color:#0b2f73;box-shadow:0 4px 0 #c96a00}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--line);box-shadow:0 4px 0 var(--sky2)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:800}
.pill[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
canvas{display:block;width:100%;max-width:420px;aspect-ratio:320/200;border-radius:16px;background:linear-gradient(#f4faff,#d8ecff);border:2px solid var(--line);margin:10px 0}
.map{overflow-x:auto}
.map svg{display:block;min-width:560px;width:100%;height:auto}
.map text{font:700 13px var(--body);fill:var(--ink)}
.map .nd{font:600 17px var(--display);fill:#fff}
/* quiz */
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;box-shadow:0 3px 0 var(--sky2)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{background:#e3f7ea;border-color:var(--good)}
.opt.wrong{background:#ffe8e6;border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--sky);font-weight:700}
.prog{height:12px;border-radius:99px;background:var(--sky2);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--orange));border-radius:99px}
.big{font:700 44px var(--display);color:var(--deep)}
.bigstars{font-size:40px;letter-spacing:6px;color:var(--sun)}
/* grids */
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mission{display:flex;gap:12px;align-items:center}
.mission .num{background:var(--sky2);color:var(--deep)}
.mission.done .num{background:var(--good);color:#fff}
.badge{text-align:center;padding:14px 10px}
.badge svg{width:84px;height:84px}
.badge.lock{filter:grayscale(1);opacity:.55}
.badge h3{font-size:16px;margin:6px 0 2px}
.badge p{font-size:13px;line-height:1.35}
.search{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:700 16px var(--body);background:#fff;color:var(--ink)}
dt{font-family:var(--display);font-weight:600;font-size:18px;color:var(--deep)}
dd{margin:2px 0 14px}
.emoji{font-size:64px;line-height:1.1;text-align:center}
.sortbtn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.sortbtn .opt{text-align:center;font:600 18px var(--display)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-weight:700}
.chk input{width:22px;height:22px;margin-top:3px;accent-color:var(--good);flex:none}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:linear-gradient(#1a6fe8,#0b4fbf);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(11,79,191,.35)}
.bnav>div{display:flex;width:100%;max-width:760px;gap:2px}
.bnav button{flex:1;min-width:0;background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 12px var(--body);padding:4px 2px;border-radius:12px}
.bnav button[aria-current=page]{background:rgba(255,255,255,.2);color:#ffe27a}
.bnav svg{width:26px;height:26px}
@media (max-width:420px){.sortbtn .opt{font-size:16px}.say img{width:60px;height:60px}.card{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var MODS=[
{id:1,title:"Tiga Wujud Benda",say:"Halo, Ilmuwan Cilik! Semua benda di sekitarmu punya wujud. Ayo kenali tiga wujud benda.",
 secs:[
  {h:"Apa itu benda?",p:["Benda adalah sesuatu yang menempati ruang dan memiliki massa. Meja, air, dan udara adalah benda.","Udara tidak terlihat, tetapi udara menempati ruang. Buktinya, balon menjadi besar saat ditiup."]},
  {h:"Tiga wujud benda",ul:["<b>Padat</b>: batu, kayu, es batu, buku.","<b>Cair</b>: air, minyak goreng, susu.","<b>Gas</b>: udara, uap air, gas elpiji."]},
  {h:"Satu zat, tiga wujud",p:["Air dapat berwujud padat (es), cair (air), atau gas (uap air). Zatnya sama, hanya wujudnya yang berbeda."]}],
 fact:"Udara adalah campuran beberapa gas, antara lain nitrogen dan oksigen. Kita bernapas dengan oksigen.",
 quiz:[
  {q:"Benda yang bentuknya tetap saat dipindah ke wadah lain adalah benda...",o:["Padat","Cair","Gas","Uap"],a:0,why:"Benda padat bentuknya tetap, misalnya batu dan kayu."},
  {q:"Manakah yang termasuk benda cair?",o:["Batu","Minyak goreng","Udara dalam balon","Kayu"],a:1,why:"Minyak goreng dapat mengalir dan mengikuti bentuk wadahnya, jadi ia benda cair."},
  {q:"Wujud padat dari air disebut...",o:["Es","Uap air","Embun","Awan"],a:0,why:"Air yang membeku menjadi es, yaitu air dalam wujud padat."}]},
{id:2,title:"Ciri Tiap Wujud",say:"Setiap wujud punya ciri khas. Yuk bandingkan bentuk, volume, dan susunan partikelnya.",
 secs:[
  {h:"Bentuk dan volume",p:["Volume adalah banyaknya ruang yang ditempati benda. Bentuk dan volume membantu kita membedakan wujud benda."],
   table:{head:["Wujud","Bentuk","Volume","Partikel"],rows:[["Padat","Tetap","Tetap","Sangat rapat dan teratur, hanya bergetar di tempat"],["Cair","Berubah mengikuti wadah","Tetap","Berdekatan, dapat bergeser"],["Gas","Berubah mengikuti ruang","Berubah, mengisi seluruh ruang","Berjauhan, bergerak bebas"]]}},
  {h:"Partikel itu apa?",p:["Semua benda tersusun dari partikel yang sangat kecil. Partikel tidak bisa dilihat dengan mata biasa. Coba tekan tombol di bawah untuk melihat bagaimana partikel bergerak pada tiap wujud."],sim:true}],
 fact:"Satu tetes air berisi sangat banyak partikel air, jumlahnya jauh lebih banyak daripada jumlah semut di bumi.",
 quiz:[
  {q:"Gas memiliki sifat...",o:["Bentuk dan volumenya tetap","Bentuk dan volumenya berubah mengikuti ruang","Bentuknya tetap, volumenya berubah","Hanya volumenya yang tetap"],a:1,why:"Gas menyebar memenuhi seluruh ruang, sehingga bentuk dan volumenya berubah."},
  {q:"Partikel yang tersusun sangat rapat dan teratur dimiliki oleh benda...",o:["Padat","Cair","Gas","Udara"],a:0,why:"Pada benda padat, partikel saling rapat dan hanya bergetar di tempatnya."},
  {q:"Susu dituang dari botol ke gelas. Apa yang berubah?",o:["Bentuknya","Banyaknya susu","Wujudnya","Massanya"],a:0,why:"Benda cair mengikuti bentuk wadah. Banyaknya (volume) susu tetap sama."}]},
{id:3,title:"Mencair dan Membeku",say:"Pernah melihat es batu meleleh? Itu salah satu perubahan wujud. Mari kita pelajari.",map:["mencair","membeku"],
 secs:[
  {h:"Mencair",p:["Mencair adalah perubahan wujud dari <b>padat menjadi cair</b>. Benda mencair jika <b>menerima panas</b>.","Contoh: es batu menjadi air, lilin meleleh, mentega meleleh di wajan, cokelat meleleh di tempat panas."]},
  {h:"Membeku",p:["Membeku adalah perubahan wujud dari <b>cair menjadi padat</b>. Benda membeku jika <b>melepas panas</b>, yaitu didinginkan.","Contoh: air dalam freezer menjadi es batu, sirup menjadi es lilin, lahar cair yang mendingin menjadi batu."]},
  {h:"Suhu penting!",p:["Es mulai mencair pada suhu 0 derajat Celsius. Air membeku pada suhu yang sama, yaitu 0 derajat Celsius."]}],
 fact:"Di negara bersalju, jalan ditaburi garam agar es lebih mudah mencair.",
 quiz:[
  {q:"Perubahan wujud dari padat menjadi cair disebut...",o:["Mencair","Membeku","Menguap","Mengembun"],a:0,why:"Padat menjadi cair = mencair."},
  {q:"Air dimasukkan ke freezer dan berubah menjadi es. Peristiwa ini disebut...",o:["Mencair","Membeku","Menguap","Menyublim"],a:1,why:"Cair menjadi padat = membeku."},
  {q:"Agar es batu mencair, es batu harus...",o:["Menerima panas","Melepas panas","Disimpan di freezer","Dikocok dalam kaleng"],a:0,why:"Mencair membutuhkan panas. Semakin banyak panas, es semakin cepat mencair."}]},
{id:4,title:"Menguap dan Mengembun",say:"Dari mana air jemuran pergi? Dan kenapa gelas es basah di luar? Ayo cari tahu.",map:["menguap","mengembun"],
 secs:[
  {h:"Menguap",p:["Menguap adalah perubahan wujud dari <b>cair menjadi gas</b>. Benda menguap jika <b>menerima panas</b>.","Menguap bisa pelan, seperti pakaian basah yang kering di jemuran. Menguap juga bisa cepat, seperti air yang mendidih. Air mendidih pada suhu sekitar 100 derajat Celsius di dataran rendah."]},
  {h:"Agar cepat menguap",ul:["Suhu lebih panas, misalnya dijemur di bawah matahari.","Ada angin.","Permukaan basah lebih luas, misalnya baju dibentangkan."]},
  {h:"Mengembun",p:["Mengembun adalah perubahan wujud dari <b>gas menjadi cair</b>. Gas mengembun jika <b>melepas panas</b> atau didinginkan.","Contoh: tetes air di luar gelas berisi es, embun pagi di daun, dan kaca kamar mandi yang berembun.","Tetes air di luar gelas es bukan bocor dari dalam gelas. Itu uap air di udara yang menjadi dingin lalu mengembun."]}],
 fact:"Uap air tidak terlihat. Yang tampak putih di atas air panas adalah butiran air kecil hasil pengembunan.",
 quiz:[
  {q:"Pakaian basah menjadi kering saat dijemur karena air...",o:["Membeku","Menguap","Mengembun","Menyublim"],a:1,why:"Air pada pakaian menerima panas lalu menguap menjadi uap air."},
  {q:"Tetes air di luar gelas berisi es berasal dari...",o:["Air dalam gelas yang merembes","Uap air di udara yang mengembun","Es yang menguap","Udara yang membeku"],a:1,why:"Udara di dekat gelas dingin, sehingga uap air mengembun menjadi tetes air."},
  {q:"Cara terbaik agar cucian cepat kering adalah...",o:["Dijemur di tempat panas dan berangin","Digulung rapat","Ditumpuk","Disimpan di lemari"],a:0,why:"Panas, angin, dan permukaan luas mempercepat penguapan."}]},
{id:5,title:"Menyublim dan Mengkristal",say:"Ada perubahan wujud yang melompati wujud cair. Seru, kan? Ayo kenali.",map:["menyublim","mengkristal"],
 secs:[
  {h:"Menyublim",p:["Menyublim adalah perubahan wujud dari <b>padat langsung menjadi gas</b>, tanpa menjadi cair dulu. Benda menyublim jika menerima panas.","Contoh: kapur barus (kamper) di lemari lama-lama mengecil dan hilang. Es kering (karbon dioksida padat) juga menyublim."]},
  {h:"Mengkristal",p:["Mengkristal adalah perubahan wujud dari <b>gas langsung menjadi padat</b>. Gas melepas panas.","Contoh: bunga es dan embun beku di tempat yang sangat dingin. Salju terbentuk dari uap air yang langsung menjadi kristal es di awan."]},
  {h:"Catatan",p:["Garam dari air laut dibuat dengan menjemur air laut. Air menguap, lalu garam tertinggal sebagai butiran kristal.","Es kering sangat dingin sekitar minus 78 derajat Celsius. Jangan memegangnya langsung."]}],
 fact:"Kapur barus tidak pernah menjadi cair. Ia langsung berubah dari padat menjadi gas.",
 quiz:[
  {q:"Kapur barus di lemari lama-lama mengecil dan hilang. Peristiwa ini disebut...",o:["Mencair","Menyublim","Membeku","Mengembun"],a:1,why:"Padat langsung menjadi gas disebut menyublim."},
  {q:"Menyublim adalah perubahan wujud dari...",o:["Cair ke gas","Gas ke cair","Padat langsung ke gas","Gas langsung ke padat"],a:2,why:"Menyublim melompati wujud cair."},
  {q:"Embun beku terbentuk dari uap air yang langsung menjadi es. Peristiwa ini disebut...",o:["Mengkristal","Menguap","Mencair","Menyublim"],a:0,why:"Gas langsung menjadi padat disebut mengkristal."}]},
{id:6,title:"Perubahan Wujud di Sekitar Kita",say:"Ternyata perubahan wujud ada di mana-mana. Mari kita rangkum semuanya.",map:["mencair","membeku","menguap","mengembun","menyublim","mengkristal"],
 secs:[
  {h:"Peta perubahan wujud",map:true},

    if(s.ul)b+='<ul>'+s.ul.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>';
    if(s.table)b+='<div class="tw"><table><thead><tr>'+s.table.head.map(function(x){return '<th scope="col">'+x+'</th>'}).join("")+'</tr></thead><tbody>'+s.table.rows.map(function(r){return '<tr>'+r.map(function(x,i){return i===0&&s.table.head.length>2?'<th scope="row">'+x+'</th>':'<td>'+x+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>';
    if(s.sim)b+=simHTML();
    if(s.map)b+='<div class="map">'+mapSVG(m.map||[])+'</div><p style="margin-top:6px;font-size:14px">Panah oranye menunjukkan perubahan yang dibahas di bab ini.</p>';
    if(s.cycle)b+=cycleHTML();
    if(s.proj){var p=s.proj;b+='<h3 style="font-size:20px;margin:0 0 6px;color:var(--deep)">'+p.t+'</h3><p><b>Alat dan bahan:</b> '+p.bahan+'.</p><div style="margin-top:6px">'+p.steps.map(function(x,i){var k=p.id+"-"+i;return '<label class="chk"><input type="checkbox" data-act="chk" data-k="'+k+'"'+(S.chk[k]?' checked':'')+'><span>'+x+'</span></label>'}).join("")+'</div><p style="margin-top:6px"><b>Ayo pikirkan:</b> '+p.tanya+'</p>'}
    b+='</section>';
  });
  if(m.map&&!m.secs.some(function(s){return s.map})&&m.id!==6){b=b.replace('</section>','</section>');}
  if(m.map&&m.id!==6)b+='<section class="card"><h2>Peta perubahan wujud</h2><div class="map">'+mapSVG(m.map)+'</div><p style="margin-top:6px;font-size:14px">Panah oranye menunjukkan perubahan yang dibahas di bab ini.</p></section>';
  b+='<div class="fact"><b>Tahukah kamu?</b>'+m.fact+'</div>';
  b+='<section class="card" id="quiz" aria-live="polite"></section>';
  return shell("Bab "+m.id+": "+m.title,b);
}

/* ============ QUIZ ENGINE ============ */
function quizHTML(){
  var m=MODS[+view.slice(4)-1];
  if(!qs)return '<h2>Kuis Bab '+m.id+'</h2><p>3 pertanyaan. Jawab benar minimal 2 untuk menyelesaikan bab dan mendapat lencana.</p><p style="margin-top:6px">Bintang terbaikmu: <b>'+'★'.repeat(st(m.id))+'☆'.repeat(3-st(m.id))+'</b></p><div class="row" style="margin-top:12px"><button class="btn sun" data-act="qstart">Mulai kuis</button></div>';
  if(qs.i>=m.quiz.length){
    var ok=qs.score>=2;var nx=m.id<8?'<button class="btn" data-go="bab-'+(m.id+1)+'">Bab berikutnya</button>':'<button class="btn" data-go="lencana">Lihat lencana</button>';
    return '<div style="text-align:center"><div class="bigstars" aria-label="'+qs.score+' bintang">'+'★'.repeat(qs.score)+'<span style="color:var(--sky2)">'+'★'.repeat(3-qs.score)+'</span></div><div class="big">'+qs.score+' / 3</div><p>'+(ok?(qs.score===3?'Sempurna! Kamu ilmuwan hebat.':'Bagus! Bab ini selesai.'):'Hampir! Baca materinya lagi lalu coba ulang.')+'</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" data-act="qstart">Ulangi</button>'+(ok?nx:'')+'</div></div>';
  }
  var q=m.quiz[qs.i];
  var h='<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="'+qs.i+'"><i style="width:'+(qs.i/3*100)+'%"></i></div><h2 style="margin-top:12px">Pertanyaan '+(qs.i+1)+' dari 3</h2><p style="font-weight:800">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,i){var c="";if(qs.pick!==null){if(i===q.a)c=" right";else if(i===qs.pick)c=" wrong"}h+='<button class="opt'+c+'" data-act="qans" data-i="'+i+'"'+(qs.pick!==null?' disabled':'')+'>'+o+'</button>'});
  h+='</div>';
  if(qs.pick!==null)h+='<div class="why">'+(qs.pick===q.a?'Benar! ':'Belum tepat. ')+q.why+'</div><div class="row" style="margin-top:12px"><button class="btn" data-act="qnext">'+(qs.i===2?'Lihat hasil':'Lanjut')+'</button></div>';
  return h;
}
function paintQuiz(){var e=$("#quiz");if(e)e.innerHTML=quizHTML()}

/* ============ OTHER VIEWS ============ */
function misiHTML(){
  var list=MODS.map(function(m){return [ "Selesaikan Bab "+m.id+": "+m.title, st(m.id)>=2,"bab-"+m.id]});
  list.push(["Raih skor 8 atau lebih di Sortir Wujud",S.games.sort>=8,"game"],["Raih skor 8 atau lebih di Tebak Proses",S.games.guess>=8,"game"],["Jawab benar Tantangan Harian",S.daily.ok>=1,"harian"]);
  var d=list.filter(function(x){return x[1]}).length,pc=Math.round(d/list.length*100);
  var b=say("Ini daftar misimu. Selesaikan semuanya untuk jadi Ilmuwan Hebat!")+'<section class="card"><h2>Progres: '+d+' dari '+list.length+' misi</h2><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pc+'"><i style="width:'+pc+'%"></i></div></section>';
  list.forEach(function(x,i){b+='<button class="card mission'+(x[1]?' done':'')+'" style="text-align:left;width:100%" data-go="'+x[2]+'"><span class="num">'+(x[1]?'✓':i+1)+'</span><span>'+x[0]+'</span></button>'});
  return shell("Misi",b);
}
function badgeSVG(i){var c=["#1666e0","#35c4ff","#2fb86a","#ff8a1f","#a05cff","#e84a8a","#00a6a6","#d49b00","#ff5d3a","#1666e0","#2fb86a","#d49b00"][i];return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="'+c+'"/><circle cx="50" cy="50" r="36" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 4"/><path d="M50 24l7.500 16 17 2-12.500 11.500 3.500 17L50 62.500 34.500 70.500l3.500-17L25.500 42l17-2z" fill="#ffd04a" stroke="#fff" stroke-width="2"/></svg>'}
function lencanaHTML(){var n=0,b="";BADGES.forEach(function(x,i){var u=x[2]();if(u)n++;b+='<div class="card badge'+(u?'':' lock')+'">'+badgeSVG(i)+'<h3>'+x[0]+'</h3><p>'+(u?'Sudah kamu dapatkan':x[1])+'</p></div>'});
  return shell("Lencanaku",say("Kamu sudah punya "+n+" dari "+BADGES.length+" lencana. Terus belajar ya!")+'<div class="g2">'+b+'</div>')}
var kq="";
function glosList(){var q=kq.toLowerCase();var r=GLOS.filter(function(g){return !q||g[0].toLowerCase().indexOf(q)>=0||g[1].toLowerCase().indexOf(q)>=0});return r.length?'<dl>'+r.map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd>'}).join("")+'</dl>':'<p>Kata tidak ditemukan. Coba kata lain.</p>'}
function kamusHTML(){return shell("Kamus Ilmuwan",say("Cari kata yang belum kamu mengerti di sini.")+'<section class="card"><label for="ks" style="font-weight:800">Cari kata</label><input id="ks" class="search" type="search" placeholder="Contoh: menguap" value="'+kq+'" autocomplete="off"><div id="kl" style="margin-top:14px">'+glosList()+'</div></section>')}
function gameMenu(){return shell("Game",say("Pilih permainan. Skor 8 atau lebih memberi lencana!")+'<div class="g2"><section class="card"><h2>Sortir Wujud</h2><p>Tentukan benda itu padat, cair, atau gas. 10 soal.</p><p style="margin:6px 0 12px">Skor terbaik: <b>'+S.games.sort+'/10</b></p><button class="btn sun" data-act="gstart" data-t="sort">Main</button></section><section class="card"><h2>Tebak Proses</h2><p>Baca kejadiannya, lalu pilih nama perubahan wujudnya. 10 soal.</p><p style="margin:6px 0 12px">Skor terbaik: <b>'+S.games.guess+'/10</b></p><button class="btn sun" data-act="gstart" data-t="guess">Main</button></section></div>')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function gameHTML(){
  var t=gs.t,title=t==="sort"?"Sortir Wujud":"Tebak Proses";
  if(gs.i>=gs.items.length){return shell(title,'<section class="card" style="text-align:center"><h2>Selesai!</h2><div class="big">'+gs.score+' / '+gs.items.length+'</div><p>'+(gs.score>=8?'Hebat! Kamu jago sekali.':'Ayo coba lagi untuk skor 8 atau lebih.')+'</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn sun" data-act="gstart" data-t="'+t+'">Main lagi</button><button class="btn ghost" data-go="game">Menu game</button></div></section>')}
  var it=gs.items[gs.i],h='<section class="card" aria-live="polite"><div class="prog"><i style="width:'+(gs.i/gs.items.length*100)+'%"></i></div><p style="margin-top:8px;font-weight:800">Soal '+(gs.i+1)+' dari '+gs.items.length+' · Skor '+gs.score+'</p>';
  if(t==="sort"){
    h+='<div class="emoji" aria-hidden="true">'+it[1]+'</div><h2 style="text-align:center;margin-top:4px">'+it[0]+'</h2><div class="sortbtn">';
    ["Padat","Cair","Gas"].forEach(function(n,i){var c="";if(gs.pick!==null){if(i===it[2])c=" right";else if(i===gs.pick)c=" wrong"}h+='<button class="opt'+c+'" data-act="gans" data-i="'+i+'"'+(gs.pick!==null?' disabled':'')+'>'+n+'</button>'});
    h+='</div>';
  }else{
    h+='<h2 style="margin-top:6px">'+it[0]+'</h2><div class="g2" style="margin-top:12px;gap:10px">';
    PROC.forEach(function(n,i){var c="";if(gs.pick!==null){if(i===it[1])c=" right";else if(i===gs.pick)c=" wrong"}h+='<button class="opt'+c+'" data-act="gans" data-i="'+i+'"'+(gs.pick!==null?' disabled':'')+'>'+n+'</button>'});
    h+='</div>';
  }
  if(gs.pick!==null){var ans=t==="sort"?it[2]:it[1];h+='<div class="why">'+(gs.pick===ans?'Benar!':'Belum tepat. Jawaban: '+(t==="sort"?["Padat","Cair","Gas"][ans]:PROC[ans])+'.')+'</div><div class="row" style="margin-top:12px"><button class="btn" data-act="gnext">Lanjut</button></div>'}
  return shell(title,h+'</section>');
}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function dailyQ(){var d=new Date();return DAILY[Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)%DAILY.length]}
function harianHTML(){
  var q=dailyQ(),done=S.daily.date===todayKey(),h=say("Satu pertanyaan baru setiap hari. Jawab benar 3 kali untuk lencana Rajin Harian.")+'<section class="card"><p style="font-weight:800">Jawaban benar sejauh ini: '+(S.daily.ok||0)+' kali</p><h2 style="margin-top:8px">Pertanyaan hari ini</h2><p style="font-weight:800">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,i){var c="";if(done){if(i===q.a)c=" right";else if(i===S.daily.pick)c=" wrong"}h+='<button class="opt'+c+'" data-act="dans" data-i="'+i+'"'+(done?' disabled':'')+'>'+o+'</button>'});
  h+='</div>';if(done)h+='<div class="why">'+(S.daily.res?'Benar! ':'Belum tepat. ')+q.why+' Sampai jumpa besok untuk pertanyaan baru.</div>';
  return shell("Tantangan Harian",h+'</section>');
}

/* ============ SIM ============ */
function startSim(){
  var cv=$("#sim");if(!cv)return;var ctx=cv.getContext("2d"),W=cv.width,H=cv.height,N=40,mode=0,P=[],rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  for(var i=0;i<N;i++){var c=i%8,r=Math.floor(i/8);P.push({bx:(W-7*56)/2+c*56,by:H-48-(4-r)*56+ -0,x:Math.random()*W,y:Math.random()*H,vx:Math.random()-.5,vy:Math.random()-.5})}
  window.__simMode=function(m){mode=m;var sp=[0,2.4,6][m]*(rm?.3:1);P.forEach(function(p){var a=Math.atan2(p.vy,p.vx)||Math.random()*6;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp})};
  var t=0;
  function frame(){t+=.05;ctx.clearRect(0,0,W,H);
    var top=mode===1?H*.45:0;
    P.forEach(function(p,i){
      if(mode===0){p.x+=(p.bx+Math.sin(t*8+i)*3-p.x)*.12;p.y+=(p.by+Math.cos(t*9+i*1.3)*3-p.y)*.12}
      else{p.x+=p.vx;p.y+=p.vy;if(p.x<10){p.x=10;p.vx=Math.abs(p.vx)}if(p.x>W-10){p.x=W-10;p.vx=-Math.abs(p.vx)}if(p.y<top+10){p.y=top+10;p.vy=Math.abs(p.vy)}if(p.y>H-10){p.y=H-10;p.vy=-Math.abs(p.vy)}}
    });
    if(mode===0){ctx.strokeStyle="rgba(22,102,224,.35)";ctx.lineWidth=3;P.forEach(function(p,i){var c=i%8;if(c<7){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(P[i+1].x,P[i+1].y);ctx.stroke()}if(i+8<N){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(P[i+8].x,P[i+8].y);ctx.stroke()}})}
    if(mode===1){ctx.fillStyle="rgba(53,196,255,.18)";ctx.fillRect(0,top,W,H-top)}
    P.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,11,0,6.283);ctx.fillStyle=mode===0?"#1666e0":mode===1?"#2f9bff":"#ff8a1f";ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="#fff";ctx.stroke()});
    anim=requestAnimationFrame(frame)}
  frame();
}

/* ============ RENDER ============ */
function render(){
  cancelAnimationFrame(anim);window.__simMode=null;
  var a=$("#app");
  if(view==="home")a.innerHTML=homeHTML();
  else if(/^bab-/.test(view)){var m=MODS[+view.slice(4)-1];a.innerHTML=modHTML(m);paintQuiz();if($("#sim"))startSim()}
  else if(view==="misi")a.innerHTML=misiHTML();
  else if(view==="lencana")a.innerHTML=lencanaHTML();
  else if(view==="kamus")a.innerHTML=kamusHTML();
  else if(view==="game")a.innerHTML=gs?gameHTML():gameMenu();
  else if(view==="harian")a.innerHTML=harianHTML();
  document.title="Laboratorium Ajaib";
}

/* ============ EVENTS ============ */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-act]");if(!t)return;
  var g=t.getAttribute("data-go");
  if(g){go(g==="START"?"bab-"+nextMod():g);return}
  var a=t.getAttribute("data-act"),i=+t.getAttribute("data-i");
  var m=/^bab-/.test(view)?MODS[+view.slice(4)-1]:null;
  if(a==="qstart"){qs={i:0,score:0,pick:null};paintQuiz()}
  else if(a==="qans"&&qs&&qs.pick===null){qs.pick=i;if(i===m.quiz[qs.i].a)qs.score++;paintQuiz()}
  else if(a==="qnext"){qs.i++;qs.pick=null;if(qs.i>=m.quiz.length){if(qs.score>st(m.id)){S.stars[m.id]=qs.score;save()}var top=$(".top .stars");if(top)top.textContent="★ "+totalStars()+"/24"}paintQuiz()}
  else if(a==="cyc"){cycI=i;var c=$("#cyctext");c.innerHTML="<b>"+CYC[i][0].slice(3)+".</b> "+CYC[i][1];document.querySelectorAll('[data-act="cyc"]').forEach(function(b,k){b.setAttribute("aria-pressed",k===i)})}
  else if(a==="sim"){var mm=+t.getAttribute("data-m");if(window.__simMode)window.__simMode(mm);$("#simtext").innerHTML=SIMT[mm];document.querySelectorAll('[data-act="sim"]').forEach(function(b,k){b.setAttribute("aria-pressed",k===mm)})}
  else if(a==="gstart"){var ty=t.getAttribute("data-t");gs={t:ty,i:0,score:0,pick:null,items:shuffle(ty==="sort"?SORT:GUESS).slice(0,10)};render();window.scrollTo(0,0)}
  else if(a==="gans"&&gs&&gs.pick===null){var it=gs.items[gs.i],ans=gs.t==="sort"?it[2]:it[1];gs.pick=i;if(i===ans)gs.score++;render()}
  else if(a==="gnext"){gs.i++;gs.pick=null;if(gs.i>=gs.items.length&&gs.score>S.games[gs.t]){S.games[gs.t]=gs.score;save()}render();window.scrollTo(0,0)}
  else if(a==="dans"&&S.daily.date!==todayKey()){var q=dailyQ();S.daily.date=todayKey();S.daily.pick=i;S.daily.res=(i===q.a);if(S.daily.res)S.daily.ok=(S.daily.ok||0)+1;save();render()}
});
document.addEventListener("change",function(e){var t=e.target;if(t.matches&&t.matches('[data-act="chk"]')){S.chk[t.getAttribute("data-k")]=t.checked;save()}});
document.addEventListener("input",function(e){if(e.target.id==="ks"){kq=e.target.value;$("#kl").innerHTML=glosList()}});

(function(){var h=(location.hash||"").slice(1);if(valid(h))view=h;render()})();
</script>
